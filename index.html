<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 자율 자리 선택기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; user-select: none; }
    .font-chalk { font-family: 'Gowun Dodum', sans-serif; }
    .seat-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .seat-card:hover:not(.seat-taken) { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 16px -2px rgba(99, 102, 241, 0.25); }
    .seat-taken { background-color: #e0e7ff !important; border-color: #6366f1 !important; color: #3730a3 !important; }
    .seat-mine { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #14532d !important; animation: pulse-mine 2s infinite; }
    @keyframes pulse-mine {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- 커스텀 알림창 (alert 대체) -->
  <div id="customAlert" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="text-indigo-500 mb-3 text-3xl"><i class="fa-solid fa-circle-exclamation"></i></div>
      <p id="customAlertMsg" class="text-slate-800 font-semibold mb-6 break-keep"></p>
      <button onclick="closeCustomAlert()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition">확인</button>
    </div>
  </div>

  <!-- 커스텀 확인창 (confirm 대체) -->
  <div id="customConfirm" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="text-rose-500 mb-3 text-3xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <p id="customConfirmMsg" class="text-slate-800 font-semibold mb-6 break-keep"></p>
      <div class="flex gap-3">
        <button onclick="closeCustomConfirm(false)" class="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition">취소</button>
        <button onclick="closeCustomConfirm(true)" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold transition">확인</button>
      </div>
    </div>
  </div>

  <!-- 입장 모달 -->
  <div id="joinModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 md:p-8 shadow-2xl text-center relative overflow-hidden">
      
      <!-- 학생 로그인 영역 -->
      <div id="studentLoginArea" class="transition-all duration-300">
        <div class="inline-flex p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-3">
          <i class="fa-solid fa-chair text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900">실시간 자리 선택</h2>
        <p class="text-xs text-slate-500 mt-1 mb-6">학번과 이름을 입력하고 교실에 입장하세요</p>

        <div class="space-y-4">
          <div class="text-left">
            <input type="text" id="studentNameInput" onkeyup="if(event.key==='Enter') enterClassroom()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none font-medium" placeholder="예: 30701 박수민">
          </div>
          <button onclick="enterClassroom()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition active:scale-98">학생 입장하기</button>
          
          <div class="pt-2 border-t border-slate-100 mt-2">
            <button onclick="toggleLoginArea('teacher')" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-sm">
              <i class="fa-solid fa-user-tie"></i> 선생님 전용 로그인
            </button>
          </div>
        </div>
      </div>

      <!-- 선생님 로그인 영역 -->
      <div id="teacherLoginArea" class="hidden transition-all duration-300">
        <div class="inline-flex p-3 bg-rose-100 text-rose-600 rounded-2xl mb-3">
          <i class="fa-solid fa-key text-3xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">선생님 권한 인증</h2>
        <p class="text-xs text-slate-500 mt-1 mb-6">교사 비밀번호를 입력해주세요.</p>

        <div class="space-y-4">
          <div class="text-left">
            <input type="password" id="teacherPwInput" onkeyup="if(event.key==='Enter') teacherLogin()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-rose-500 text-sm outline-none font-medium text-center" placeholder="비밀번호 4자리">
          </div>
          <div class="flex gap-2">
            <button onclick="toggleLoginArea('student')" class="flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition">취소</button>
            <button onclick="teacherLogin()" class="flex-1 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg transition">인증하기</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 상단 헤더 -->
  <header class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-school text-xl"></i></div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-slate-900">실시간 자율 자리 선택 교실</h1>
            <span id="syncIndicator" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">연결 중...</span>
          </div>
          <p id="userInfoText" class="text-xs text-slate-500">접속자: 대기 중</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 flex-wrap">
        <div class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-2 rounded-xl">선택완료: <b id="selectedCount">0</b> / 29명</div>
        
        <button onclick="showJoinModal()" class="px-3 py-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-300 rounded-xl text-xs font-bold transition">
          <i class="fa-solid fa-pen-to-square"></i> 정보 변경
        </button>

        <!-- 선생님 전용 컨트롤 패널 -->
        <div id="teacherControls" class="hidden items-center gap-2 bg-rose-50 p-1.5 rounded-xl border border-rose-100">
          <button onclick="toggleTeacherMode()" class="px-3 py-1.5 bg-white text-rose-600 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-user-gear"></i> 교사모드: <span id="teacherModeStatus">OFF</span>
          </button>
          <button id="startSelectionBtn" onclick="toggleSelectionLock()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm transition">
            선택 시작
          </button>
          <button onclick="cleanDuplicateSeats()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold shadow-sm transition" title="중복으로 차지된 자리를 정리합니다">
            <i class="fa-solid fa-broom"></i> 정리
          </button>
          <button onclick="resetAllSeats()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold shadow-sm transition">
            전체 초기화
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 교실 영역 -->
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- 접속자 명단 (LMS 형태) -->
    <div class="bg-white p-4 rounded-2xl mb-6 shadow-sm border border-slate-200">
      <h3 class="text-sm font-bold text-slate-700 mb-2"><i class="fa-solid fa-users text-indigo-500 mr-1"></i> 현재 접속 중인 학생 (<span id="userCount">0</span>명)</h3>
      <div id="activeUsersList" class="flex flex-wrap gap-2 text-xs font-medium text-slate-600">아직 접속한 학생이 없습니다.</div>
    </div>

    <!-- 상태 메시지 -->
    <div id="statusBanner" class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl mb-6 flex items-center gap-4 shadow-sm transition-colors duration-300">
      <span class="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center"><i class="fa-solid fa-satellite-dish animate-pulse"></i></span>
      <span id="statusMessage" class="font-medium text-indigo-900">선생님이 자리 선택을 시작할 때까지 대기해 주세요.</span>
    </div>

    <!-- 교실 본체 -->
    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-200/80 relative">
      <div id="lockOverlay" class="absolute inset-0 bg-white/60 backdrop-blur-sm z-20 flex items-center justify-center rounded-3xl transition-opacity duration-300">
        <div class="bg-slate-800 text-white px-6 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2">
          <i class="fa-solid fa-lock"></i> 자리가 잠겨 있습니다
        </div>
      </div>
      
      <div class="relative mb-10 text-center">
        <div class="w-full max-w-2xl mx-auto bg-emerald-900 border-8 border-amber-800 rounded-xl p-4 shadow-lg text-amber-100 text-lg font-bold">칠 판 (앞 쪽)</div>
        <div class="w-24 h-9 bg-amber-700 border-2 border-amber-900 rounded-lg mx-auto mt-3 shadow-md flex items-center justify-center text-amber-100 text-xs font-bold">교탁</div>
      </div>
      <div id="seatLayout" class="space-y-6 md:space-y-8 max-w-4xl mx-auto"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ✅ 진짜 데이터베이스 키
    const firebaseConfig = {
      apiKey: "AIzaSyCgAvzXn5V_MA1jqEJuvREI4caqBlv35U4",
      authDomain: "jari-5c613.firebaseapp.com",
      projectId: "jari-5c613",
      storageBucket: "jari-5c613.firebasestorage.app",
      messagingSenderId: "632470920233",
      appId: "1:632470920233:web:1f114eee7b14f33d03d038"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 전역 상태 변수
    window.seatData = {};
    window.usersData = {};
    window.appState = { isLocked: true };
    window.isTeacherMode = false;
    window.studentName = localStorage.getItem('student_name') || '';

    // 커스텀 알림창 로직
    window.showCustomAlert = (msg) => {
      document.getElementById('customAlertMsg').innerText = msg;
      document.getElementById('customAlert').classList.remove('hidden');
    };
    window.closeCustomAlert = () => { document.getElementById('customAlert').classList.add('hidden'); };
    
    let confirmCallback = null;
    window.showCustomConfirm = (msg, callback) => {
      document.getElementById('customConfirmMsg').innerText = msg;
      document.getElementById('customConfirm').classList.remove('hidden');
      confirmCallback = callback;
    };
    window.closeCustomConfirm = (result) => {
      document.getElementById('customConfirm').classList.add('hidden');
      if (confirmCallback) confirmCallback(result);
    };

    // 로그인 에리어 토글 기능
    window.toggleLoginArea = (type) => {
      if(type === 'teacher') {
        document.getElementById('studentLoginArea').classList.add('hidden');
        document.getElementById('teacherLoginArea').classList.remove('hidden');
        document.getElementById('teacherPwInput').focus();
      } else {
        document.getElementById('teacherLoginArea').classList.add('hidden');
        document.getElementById('studentLoginArea').classList.remove('hidden');
      }
    };

    window.showJoinModal = function() {
      document.getElementById('joinModal').classList.remove('hidden');
    };

    // 초기 이름 세팅
    if (window.studentName && window.studentName !== "👨‍🏫 선생님") {
      document.getElementById('studentNameInput').value = window.studentName;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { await signInAnonymously(auth); return; }
      window.userUid = user.uid;
      
      // 실시간 데이터 수신 시작
      const docRef = doc(db, 'classroom', 'realtime_data');
      onSnapshot(docRef, (snap) => {
        const indicator = document.getElementById('syncIndicator');
        indicator.innerHTML = "🟢 실시간 연결됨";
        indicator.className = "text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700";
        
        if(snap.exists()) {
          const data = snap.data();
          window.seatData = data.seats || {};
          window.usersData = data.users || {};
          window.appState = data.state || { isLocked: true };
          updateUI();
        }
      }, (err) => {
        console.error(err);
        const indicator = document.getElementById('syncIndicator');
        indicator.innerHTML = "🔴 DB 규칙 오류!";
        indicator.className = "text-[11px] font-semibold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700";
        window.showCustomAlert("데이터베이스 규칙이 막혀있습니다. 콘솔에서 권한을 변경해주세요.");
      });
    });

    // 선생님 로그인 처리
    window.teacherLogin = function() {
      const pw = document.getElementById('teacherPwInput').value;
      if (pw === "7362") {
        window.studentName = "👨‍🏫 선생님";
        window.isTeacherMode = true;
        document.getElementById('teacherControls').classList.remove('hidden');
        document.getElementById('teacherControls').classList.add('flex');
        document.getElementById('teacherPwInput').value = '';
        completeJoin();
      } else { 
        window.showCustomAlert("비밀번호가 일치하지 않습니다."); 
      }
    };

    // 학생 입장 처리
    window.enterClassroom = function() {
      const name = document.getElementById('studentNameInput').value.trim();
      if (!name) return window.showCustomAlert("학번과 이름을 정확히 입력해주세요.");
      
      window.studentName = name;
      localStorage.setItem('student_name', name);
      window.isTeacherMode = false;
      document.getElementById('teacherControls').classList.add('hidden');
      document.getElementById('teacherControls').classList.remove('flex');
      completeJoin();
    };

    function completeJoin() {
      document.getElementById('joinModal').classList.add('hidden');
      document.getElementById('userInfoText').innerText = `접속자: ${window.studentName}`;
      
      // 선생님이 아닌 경우만 명단에 등록
      if(window.studentName !== "👨‍🏫 선생님") {
        window.usersData[window.userUid] = { name: window.studentName, time: Date.now() };
      }
      syncDB();
    }

    // 기능 제어 로직
    window.toggleSelectionLock = function() {
      window.appState.isLocked = !window.appState.isLocked;
      syncDB();
    };

    window.toggleTeacherMode = function() {
      window.isTeacherMode = !window.isTeacherMode;
      document.getElementById('teacherModeStatus').innerText = window.isTeacherMode ? "ON" : "OFF";
      updateUI();
    };

    window.handleSeatClick = function(idx) {
      if (window.appState.isLocked && !window.isTeacherMode) return;
      const key = `seat_${idx}`;
      const occ = window.seatData[key];

      // 선생님 모드일 경우: 자리를 강제로 비움
      if (window.isTeacherMode && occ) {
        window.showCustomConfirm(`'${occ.name}' 학생의 자리를 강제로 비우시겠습니까?`, (confirmed) => {
          if(confirmed) {
            delete window.seatData[key];
            syncDB();
          }
        });
        return;
      }

      // 내 이름이나 내 기기(UID)로 선택된 자리가 있는지 확인 (본인 인증)
      const isMine = occ && (occ.uid === window.userUid || occ.name === window.studentName);

      // 남의 자리를 클릭한 경우 차단
      if (occ && !isMine) {
        return window.showCustomAlert(`[${occ.name}] 학생이 이미 선택한 자리입니다.`);
      }

      // 내 자리를 한 번 더 클릭하면 선택 취소
      if (isMine) {
        delete window.seatData[key];
        syncDB();
        return;
      }
      
      // 💡 1인 1자리 보장 핵심 로직: 새 자리를 클릭하면 기존의 내 자리를 싹 지움
      Object.keys(window.seatData).forEach(k => {
        if (window.seatData[k].uid === window.userUid || window.seatData[k].name === window.studentName) {
          delete window.seatData[k];
        }
      });

      // 새로운 자리에 배치
      window.seatData[key] = { name: window.studentName, uid: window.userUid, time: Date.now() };
      syncDB();
    };

    // 중복 수동 정돈 함수 (동시접속 버그 대비 방어 로직)
    window.cleanDuplicateSeats = function() {
      const nameLatestSeat = {};
      const newSeatData = {};
      
      // 가장 최근에 클릭한 자리 하나만 살림
      Object.keys(window.seatData).forEach(seatKey => {
        const item = window.seatData[seatKey];
        if (item && item.name) {
          const existing = nameLatestSeat[item.name];
          const itemTime = item.time || 0;
          if (!existing || itemTime > existing.time) {
            nameLatestSeat[item.name] = { seatKey, item, time: itemTime };
          }
        }
      });

      Object.values(nameLatestSeat).forEach(({ seatKey, item }) => {
        newSeatData[seatKey] = item;
      });

      window.seatData = newSeatData;
      syncDB();
      window.showCustomAlert("중복으로 선택된 자리를 모두 정돈했습니다!");
    };

    window.resetAllSeats = function() {
      window.showCustomConfirm('모든 학생의 자리를 완전히 초기화합니까?', (confirmed) => {
        if(confirmed) {
          window.seatData = {};
          window.appState.isLocked = true;
          syncDB();
        }
      });
    };

    async function syncDB() {
      if(!window.userUid) return;
      
      await setDoc(doc(db, 'classroom', 'realtime_data'), {
        seats: window.seatData,
        users: window.usersData,
        state: window.appState
      });
    }

    function updateUI() {
      // 1. 상태 배너 및 잠금 화면 업데이트
      const lockOverlay = document.getElementById('lockOverlay');
      const startBtn = document.getElementById('startSelectionBtn');
      const banner = document.getElementById('statusBanner');
      const bannerMsg = document.getElementById('statusMessage');
      
      if(window.appState.isLocked) {
        lockOverlay.classList.remove('hidden');
        banner.className = "bg-rose-50 border border-rose-200 p-4 rounded-2xl mb-6 flex items-center gap-4 shadow-sm transition-colors duration-300";
        bannerMsg.innerText = "선생님이 자리를 잠갔습니다. 대기해 주세요.";
        if(startBtn) {
          startBtn.innerText = "선택 시작";
          startBtn.className = "px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm transition";
        }
      } else {
        lockOverlay.classList.add('hidden');
        banner.className = "bg-indigo-50 border border-indigo-200 p-4 rounded-2xl mb-6 flex items-center gap-4 shadow-sm transition-colors duration-300";
        bannerMsg.innerText = "자물쇠가 풀렸습니다! 원하는 빈자리를 클릭하세요.";
        if(startBtn) {
          startBtn.innerText = "선택 중지";
          startBtn.className = "px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold shadow-sm transition";
        }
      }

      // 2. 접속자 명단 업데이트 (선생님 및 중복 이름 제외)
      const uniqueNames = new Set();
      Object.values(window.usersData).forEach(u => {
        if (u.name && u.name !== "👨‍🏫 선생님") uniqueNames.add(u.name);
      });
      
      const uList = Array.from(uniqueNames).map(name => `<span class="bg-indigo-50 border border-indigo-100 px-2 py-1 rounded-md text-slate-700 shadow-sm">${name}</span>`);
      document.getElementById('activeUsersList').innerHTML = uList.length ? uList.join('') : "아직 접속한 학생이 없습니다.";
      document.getElementById('userCount').innerText = uList.length;

      // 3. 자리 배치도 업데이트
      const container = document.getElementById('seatLayout');
      container.innerHTML = '';
      let seatIdx = 0, count = 0;

      for (let r = 0; r < 4; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = "flex justify-center items-center gap-3 md:gap-6 flex-wrap";
        const pairsInRow = (r < 3) ? 4 : 3; // 8명, 8명, 8명, 5명 레이아웃

        for (let p = 0; p < pairsInRow; p++) {
          const pairDiv = document.createElement('div');
          pairDiv.className = "flex gap-2 p-2 rounded-xl border border-slate-200 shadow-sm bg-slate-50";
          const seatsInThisPair = (r === 3 && p === 2) ? 1 : 2; // 마지막 줄 맨 끝은 1자리

          for (let s = 0; s < seatsInThisPair; s++) {
            if (seatIdx < 29) {
              const occ = window.seatData[`seat_${seatIdx}`];
              if (occ) count++;
              
              // 본인 자리인지 판별 (UID 일치 또는 이름 일치)
              const isMine = occ && (occ.uid === window.userUid || occ.name === window.studentName);
              
              const btn = document.createElement('button');
              btn.onclick = ((idx) => () => window.handleSeatClick(idx))(seatIdx);
              
              // 스타일 부여 로직
              let btnClass = `seat-card relative w-16 h-14 md:w-20 md:h-16 rounded-xl font-bold border-2 text-xs flex flex-col items-center justify-center shadow-sm cursor-pointer `;
              if (isMine) {
                btnClass += `seat-mine`;
              } else if (occ) {
                btnClass += `seat-taken ${window.isTeacherMode ? 'hover:bg-rose-100 hover:border-rose-400' : ''}`;
              } else {
                btnClass += `bg-white border-slate-300 text-slate-700 hover:border-indigo-400`;
              }
              btn.className = btnClass;

              // 버튼 내용물 조립
              btn.innerHTML = `
                <span class="text-[10px] text-slate-400 absolute top-1 left-1.5">${seatIdx + 1}</span>
                ${window.isTeacherMode && occ ? '<span class="text-[9px] bg-rose-500 text-white font-bold px-1 rounded absolute top-1 right-1"><i class="fa-solid fa-xmark"></i></span>' : ''}
                <span class="font-bold truncate mt-1 w-full px-1">${occ ? occ.name : '<span class="text-slate-300 font-normal">빈 자리</span>'}</span>
              `;
              pairDiv.appendChild(btn);
              seatIdx++;
            }
          }
          rowDiv.appendChild(pairDiv);
        }
        container.appendChild(rowDiv);
      }
      document.getElementById('selectedCount').innerText = count;
    }
  </script>
</body>
</html>
